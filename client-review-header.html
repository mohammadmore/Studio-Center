</head>
<body>
    <div class="container">

                
        <div class="client-header-container" style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-color);">
            <!-- Right side: Logo & Name -->
            <div style="display: flex; align-items: center; gap: 15px;">
                <% if (typeof org !== 'undefined' && org) { %>
                    <% if (org.logo_url) { %>
                        <img alt="" src="<%= org.logo_url %>" alt="<%= org.org_name %>" class="header-right-logo" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid <%= org.color || 'var(--primary-color)' %>; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <% } else { %>
                        <div class="header-right-logo" style="width: 80px; height: 80px; border-radius: 50%; background: <%= org.color || 'var(--primary-color)' %>; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"><%= org.org_name.substring(0, 1) %></div>
                    <% } %>
                    
                    <div style="display: flex; flex-direction: column; align-items: flex-start;">
                        <h2 style="color: var(--text-gray); margin: 0; font-size: 1.1rem;"><%= org.org_name %></h2>
                    </div>
                <% } %>
                
            </div>
            
            <!-- Left side: Icons (Back, Theme, Bell, Logout) -->
            <div class="header-icons-left" style="display: flex; align-items: center; gap: 10px;">
                <button onclick="toggleTheme(event)" id="theme-toggle-btn" style="background: none; border: none; color: var(--text-gray); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="تغییر تم">
                    <svg class="icon-moon" style="display: none; width: 22px; height: 22px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <svg class="icon-sun" style="display: none; width: 22px; height: 22px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>

                <div style="position: relative;">
                    <a href="javascript:void(0)" onclick="toggleNotifications(event)" id="client-bell-icon" style="color: var(--text-gray); text-decoration: none; position: relative; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;">
                        <svg class="lucide lucide-bell" style="width: 22px; height: 22px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg>
                        <span id="notif-badge" style="display: none; position: absolute; top: 0px; right: 0px; background: var(--error-color); color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px;"></span>
                    </a>
                    <div id="notif-dropdown" style="display: none; position: absolute; left: 0; right: auto; top: 40px; width: 320px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border-color); z-index: 100000; overflow: hidden; color: var(--text-gray); text-align: right; direction: rtl;">
                        <div style="background: rgba(128, 128, 128, 0.05); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: bold;">پیام‌ها و اعلان‌ها</span>
                        </div>
                        <div id="notif-list" style="max-height: 350px; overflow-y: auto;">
                            <div class="skeleton" style="height: 60px; width: 100%; margin-bottom: 10px; border-radius: 8px;"></div><div class="skeleton" style="height: 60px; width: 100%; border-radius: 8px;"></div>
                        </div>
                        <div style="padding: 10px; text-align: center; border-top: 1px solid var(--border-color); background: rgba(128, 128, 128, 0.05);">
                            <button onclick="markAllRead()" style="background: none; border: none; color: var(--text-gray); font-size: 0.85rem; cursor: pointer;"><svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align: middle; margin-left: 4px;'><path d='M20 6 9 17l-5-5'/></svg> علامت‌گذاری همه به عنوان خوانده شده</button>
                        </div>
                    </div>
                </div>
