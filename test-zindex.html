<!DOCTYPE html>
<html>
<head>
<style>
  table { border-collapse: collapse; }
  td { padding: 10px; border: 1px solid #ccc; }
  .multi-select { position: relative; width: 100%; text-align: right; z-index: 1; }
  .multi-select-display { min-height: 34px; background: red; }
  .multi-select-dropdown { position: absolute; top: 100%; left: 0; background: yellow; height: 100px; width: 100px; display: none; }
</style>
</head>
<body>
<table>
  <tr><td>
    <div class="multi-select" id="m1">
      <div class="multi-select-display" onclick="document.getElementById('d1').style.display='block'; document.getElementById('m1').style.zIndex='9999';">Click</div>
      <div class="multi-select-dropdown" id="d1">Dropdown 1</div>
    </div>
  </td></tr>
  <tr><td>
    <div class="multi-select">
      <div class="multi-select-display">Other</div>
    </div>
  </td></tr>
</table>
</body>
</html>
